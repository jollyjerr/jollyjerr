{% extends "base.html" %}

{% block content %}
  <div class="home-section">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li>
          <a href="{{ get_url(path="/tags") }}">Tags</a>
          <span aria-hidden="true">/</span>
        </li>
      </ol>
      <h1 aria-current="page">{{ term.name | capitalize }}</h1>
    </nav>

    <ul class="post-list">
      {% for page in term.pages %}
        <li class="post-item">
          <a href="{{ page.permalink }}" class="post-link">
            <div class="post-title">{{ page.title }}</div>
            <time datetime="{{ page.date }}" class="post-date">
              {{ page.date | date(format="%B %-d, %Y") }}
            </time>
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock content %}
